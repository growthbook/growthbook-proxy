name: "Eval: deploy to NPM"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publish to NPM
    if: ${{ github.ref == 'refs/heads/main' }}

    # OIDC trusted publishing: npm exchanges the GitHub token, no NPM_TOKEN secret
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Check dependencies install from npm
        run: node .github/scripts/check-publishable.mjs packages/lib/eval

      - name: Build & Publish
        run: |
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10
          npm install -g npm@11
          pnpm install
          pnpm --filter @growthbook/proxy-eval build
          cd packages/lib/eval
          npm publish
