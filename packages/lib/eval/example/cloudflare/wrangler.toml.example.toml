name = "growthbook-edge-evaluator"
main = "src/index.ts"
compatibility_date = "2025-09-25"

# Variable bindings. These are arbitrary, plaintext strings (similar to environment variables)
# Note: Use secrets to store sensitive data.
# Docs: https://developers.cloudflare.com/workers/platform/environment-variables

kv_namespaces = [
  { binding = "KV_GB_PAYLOAD", id = "qwerty123" },
  # Optional: enables sticky bucketing
  # { binding = "KV_STICKY_BUCKETS", id = "qwerty456" },
]

[vars]
NODE_ENV="production"
# Optional: sticky bucket expiration in seconds, min 60
# STICKY_BUCKET_TTL="2592000"
